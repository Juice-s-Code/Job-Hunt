name: Toolkit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run all synthetic tests
        run: python -B -m unittest discover -s tests -v
      - name: Validate templates and clean export
        run: python -B verify_release.py --output "${{ runner.temp }}/job-hunt-release.zip"
